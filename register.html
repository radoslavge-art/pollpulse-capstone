<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Join | PollPulse</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="/src/css/styles.css"></head><body><nav class="navbar navbar-dark"><div class="container"><a class="navbar-brand" href="index.html">PollPulse</a></div></nav><main class="container py-5"><div class="row justify-content-center"><div class="col-md-7 col-lg-6"><div class="card shadow-sm border-0"><div class="card-body p-4 p-md-5"><h1 class="h2">Create your account</h1><p class="text-secondary">Start creating and voting in a few seconds.</p><div id="alert-host"></div><form id="register-form"><label class="form-label" for="name">Display name</label><input class="form-control mb-3" id="name" required maxlength="60"><label class="form-label" for="email">Email</label><input class="form-control mb-3" id="email" type="email" required><label class="form-label" for="password">Password</label><input class="form-control mb-4" id="password" type="password" minlength="6" required><button class="btn btn-primary w-100">Create account</button></form><p class="text-center small mt-4 mb-0">Already a member? <a href="login.html">Log in</a></p></div></div></div></div></main><script type="module" src="/src/js/auth.js"></script></body></html>
