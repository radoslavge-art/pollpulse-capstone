<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create a poll | PollPulse</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="/src/css/styles.css"></head><body><nav class="navbar navbar-expand navbar-dark"><div class="container"><a class="navbar-brand" href="index.html">PollPulse</a><div class="navbar-nav me-auto"><a class="nav-link" href="index.html">Explore</a><a class="nav-link" href="join.html">Join room</a></div><div id="auth-area"></div></div></nav><header class="page-head"><div class="container"><h1>Create a live poll</h1><p class="mb-0 text-secondary">Choose a room look, then share its QR code with your audience.</p></div></header><main class="container py-5"><div class="row justify-content-center"><div class="col-lg-8"><div id="alert-host"></div><form id="poll-form" class="card shadow-sm border-0 p-4"><label class="form-label" for="title">Question</label><input class="form-control mb-3" id="title" placeholder="What should we decide?" maxlength="140" required><label class="form-label" for="description">Description <span class="text-secondary">(optional)</span></label><textarea class="form-control mb-3" id="description" rows="3" maxlength="500"></textarea><label class="form-label" for="category">Category</label><select class="form-select mb-4" id="category"><option>General</option><option>Work</option><option>Learning</option><option>Community</option><option>Entertainment</option></select><fieldset class="mb-4"><legend class="fs-6 mb-2">Room theme</legend><div class="theme-picker" role="radiogroup"><label class="theme-choice ocean"><input type="radio" name="theme" value="ocean" checked><span>Ocean</span></label><label class="theme-choice sunset"><input type="radio" name="theme" value="sunset"><span>Sunset</span></label><label class="theme-choice forest"><input type="radio" name="theme" value="forest"><span>Forest</span></label><label class="theme-choice midnight"><input type="radio" name="theme" value="midnight"><span>Midnight</span></label></div></fieldset><div class="d-flex justify-content-between align-items-center"><label class="form-label mb-0">Options <span class="text-secondary">(2–6)</span></label><button class="btn btn-sm btn-outline-primary" type="button" id="add-option">Add option</button></div><div id="options" class="mt-2"><input class="form-control mb-2" name="option" placeholder="Option 1" required><input class="form-control mb-2" name="option" placeholder="Option 2" required></div><hr class="my-4"><button class="btn btn-primary">Create live room</button></form></div></div></main><script type="module" src="/src/js/create-poll.js"></script></body></html>
